<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 120" width="100%" height="120" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="footer-bg-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10070C"/>
      <stop offset="25%" stop-color="#190B12"/>
      <stop offset="50%" stop-color="#240B18"/>
      <stop offset="75%" stop-color="#190B12"/>
      <stop offset="100%" stop-color="#10070C"/>
    </linearGradient>

    <!-- Center Wine Pulse Gradient -->
    <radialGradient id="footer-center-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#701A3D" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#451126" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#10070C" stop-opacity="0"/>
    </radialGradient>

    <!-- Accent Line Gradient -->
    <linearGradient id="footer-line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#451126" stop-opacity="0"/>
      <stop offset="30%" stop-color="#701A3D" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#E5B5C7" stop-opacity="1"/>
      <stop offset="70%" stop-color="#701A3D" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#451126" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="footer-pulse-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#701A3D" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#F8F0F3" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#701A3D" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Filter for Glow -->
    <filter id="footer-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Fine Grid Pattern -->
    <pattern id="footer-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#451126" stroke-width="0.6" stroke-opacity="0.25"/>
    </pattern>
  </defs>

  <style>
    .mono-foot {
      font-family: 'Share Tech Mono', 'Courier New', Consolas, Monaco, monospace;
    }
    .sans-foot {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
  </style>

  <!-- Base Background -->
  <rect width="100%" height="100%" fill="url(#footer-bg-grad)" rx="8" ry="8"/>
  <rect width="100%" height="100%" fill="url(#footer-center-glow)" rx="8" ry="8"/>
  <rect width="100%" height="100%" fill="url(#footer-grid)" rx="8" ry="8"/>

  <!-- Border & Accents -->
  <rect x="6" y="6" width="908" height="108" rx="6" ry="6" fill="none" stroke="#451126" stroke-width="1" stroke-opacity="0.7"/>
  <rect x="10" y="10" width="900" height="100" rx="4" ry="4" fill="none" stroke="#701A3D" stroke-width="0.6" stroke-opacity="0.3"/>

  <!-- Tactical L-Brackets -->
  <path d="M 14 26 L 14 14 L 26 14" fill="none" stroke="#C77B9B" stroke-width="2" stroke-linecap="round"/>
  <path d="M 894 14 L 906 14 L 906 26" fill="none" stroke="#C77B9B" stroke-width="2" stroke-linecap="round"/>
  <path d="M 14 94 L 14 106 L 26 106" fill="none" stroke="#C77B9B" stroke-width="2" stroke-linecap="round"/>
  <path d="M 894 106 L 906 106 L 906 94" fill="none" stroke="#C77B9B" stroke-width="2" stroke-linecap="round"/>

  <!-- Top Center Dividing Line with Signal Wave -->
  <line x1="60" y1="28" x2="860" y2="28" stroke="url(#footer-line-grad)" stroke-width="1.2"/>

  <!-- Glowing Scanner Node on Dividing Line (SMIL) -->
  <circle cx="460" cy="28" r="3.5" fill="#F8F0F3" filter="url(#footer-glow)">
    <animate attributeName="cx" values="180;740;180" dur="6s" repeatCount="indefinite" ease="easeInOut"/>
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Left Status & Location -->
  <g class="mono-foot" font-size="10" fill="#C77B9B">
    <circle cx="42" cy="56" r="3.5" fill="#E5B5C7">
      <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="42" cy="56" r="6" fill="none" stroke="#C77B9B" stroke-width="0.8">
      <animate attributeName="r" values="3.5;8;3.5" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0;0.7" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="56" y="60" letter-spacing="1.5px" font-weight="600" fill="#E5B5C7">
      SEC_NODE // ACTIVE VIGILANCE
    </text>
    <text x="56" y="80" font-size="9" fill="#C77B9B" letter-spacing="1.2px" opacity="0.8">
      KOZHIKODE · KERALA · INDIA [11.2588° N, 75.7804° E]
    </text>
  </g>

  <!-- Center Branding Signature -->
  <g class="sans-foot" text-anchor="middle">
    <text x="460" y="60" font-size="14" font-weight="700" fill="#F8F0F3" letter-spacing="2.5px">
      MUHAMMED IJAS VP
    </text>
    <text x="460" y="80" class="mono-foot" font-size="9.5" fill="#C77B9B" letter-spacing="1.8px">
      PENETRATION TESTING · SOC OPERATIONS · ACTIVE DIRECTORY DEFENSE
    </text>
  </g>

  <!-- Right Hash & Security Badge -->
  <g class="mono-foot" text-anchor="end" font-size="9" fill="#C77B9B">
    <text x="874" y="60" letter-spacing="1.2px" fill="#E5B5C7">
      ETHICAL RESEARCH &amp; SECURE PRACTICE
    </text>
    <text x="874" y="80" letter-spacing="1px" opacity="0.75">
      “Learn by building and breaking responsibly”
    </text>
  </g>

  <!-- Bottom Terminal Micro-line -->
  <line x1="120" y1="96" x2="800" y2="96" stroke="#451126" stroke-width="0.8" stroke-dasharray="4 6"/>
  <circle cx="460" cy="96" r="2" fill="#701A3D"/>
</svg>
